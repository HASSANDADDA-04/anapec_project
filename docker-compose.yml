services:
  db:
    image: postgres:16
    container_name: anapec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: anapec
      POSTGRES_PASSWORD: anapec
      POSTGRES_DB: anapec
    ports:
      - "5433:5432"
    volumes:
      - anapec_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anapec -d anapec"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anapec-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://anapec:anapec@db:5432/anapec
      JWT_SECRET: anapec-dev-secret-change-me
      JWT_HOURS: 12
      DATA_DIR: /app/data
      RAW_DIR: /app/data/raw/esco
      INTERIM_DIR: /app/data/interim
      PROCESSED_DIR: /app/data/processed
      EXTERNAL_DIR: /app/data/external
      ESCO_DIR: /app/data/raw/esco
      MODELS_DIR: /app/models
      REPORTS_DIR: /app/reports
      REFERENCES_DIR: /app/references
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./references:/app/references:ro
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
    container_name: anapec-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  sonarqube:
    image: sonarqube:lts-community
    container_name: anapec-sonarqube
    restart: unless-stopped
    ports:
      - "9001:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    profiles:
      - sonar
      - all

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: anapec-sonar-scanner
    depends_on:
      - sonarqube
    environment:
      - SONAR_HOST_URL=http://sonarqube:9000
    volumes:
      - .:/usr/src
    profiles:
      - sonar

volumes:
  anapec_pg:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
