<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <text x="325" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0E2A47">Matrice de Confusion sur le Jeu de Test</text>
