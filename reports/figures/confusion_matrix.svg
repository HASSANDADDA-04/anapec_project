  <text x="515" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">Prédiction : Négative</text>

  <text x="140" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748" transform="rotate(-90 140,200)">Réel : Positif</text>
  <text x="140" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748" transform="rotate(-90 140,340)">Réel : Négatif</text>

