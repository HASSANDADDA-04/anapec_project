  <text x="365" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#2C5282">Vrais Positifs (TP)</text>
  <text x="365" y="222" text-anchor="middle" font-size="11" fill="#4A5568">Taux: 81.9 % (Rappel)</text>

  <!-- Top-Right: False Negative -->
  <rect x="445" y="130" width="150" height="130" rx="8" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5"/>
  <text x="520" y="175" text-anchor="middle" font-size="26" font-weight="bold" fill="#C53030">1 096</text>
