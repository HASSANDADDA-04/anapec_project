  <text x="520" y="222" text-anchor="middle" font-size="11" fill="#4A5568">Erreur de type II</text>

  <!-- Bottom-Left: False Positive -->
  <rect x="290" y="265" width="150" height="130" rx="8" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5"/>
  <text x="365" y="310" text-anchor="middle" font-size="26" font-weight="bold" fill="#C53030">1 617</text>
  <text x="365" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#9B2C2C">Faux Positifs (FP)</text>
