  <!-- Bottom-Right: True Negative -->
  <rect x="445" y="265" width="150" height="130" rx="8" fill="#EBF8FF" stroke="#3182CE" stroke-width="2"/>
  <text x="520" y="310" text-anchor="middle" font-size="26" font-weight="bold" fill="#2B6CB0">4 445</text>
  <text x="520" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#2C5282">Vrais Négatifs (TN)</text>
  <text x="520" y="357" text-anchor="middle" font-size="11" fill="#4A5568">Taux: 73.3 %</text>

