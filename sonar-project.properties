# ==============================================================
# Configuration SonarQube - Plateforme ANAPEC
# ==============================================================

# Métadonnées du projet
sonar.projectKey=anapec-project
sonar.projectName=ANAPEC Intelligent Matching Platform
sonar.projectVersion=1.0.0

# Répertoires de code source à analyser (Backend FastAPI & Frontend React)
sonar.sources=backend/app,frontend/src

# Répertoire des tests unitaires
sonar.tests=backend/tests

# Encodage des fichiers
sonar.sourceEncoding=UTF-8

# Exclusions : dépendances, données massives, modèles ML, uploads et rapports générés
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  data/**,\
  models/**,\
  reports/**,\
  docs/**,\
  backend/uploads/**,\
  backend/tessdata/**,\
  frontend/public/**,\
  **/*.svg,\
  **/*.json,\
  **/*.csv,\
  **/*.parquet,\
  **/*.pdf

# Configuration Python
sonar.python.version=3.10, 3.11, 3.12
sonar.python.coverage.reportPaths=reports/coverage.xml

# Configuration JavaScript / React
sonar.javascript.environments=browser,node

